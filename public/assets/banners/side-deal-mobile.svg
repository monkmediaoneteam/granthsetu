      <stop offset="0%" stop-color="#fffaf0"/>
      <stop offset="60%" stop-color="#f6ecd9"/>
      <stop offset="100%" stop-color="#ebd8b5"/>
    </linearGradient>
    <radialGradient id="side1-radial" cx="85%" cy="85%" r="75%">
      <stop offset="0%" stop-color="#b9852e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#side1-bg)"/>
  <rect width="640" height="400" fill="url(#side1-radial)"/>

  <!-- Border -->
