    <circle cx="0" cy="0" r="72" fill="none" stroke="#b9852e" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.5"/>
    
    <!-- Sunburst / Star of Excellence -->
    <path d="M 0,-45 L 8,-12 L 40,-8 L 14,8 L 22,40 L 0,18 L -22,40 L -14,8 L -40,-8 L -8,-12 Z" fill="#b9852e" fill-opacity="0.85"/>
  </g>

