<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="mob-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fafaf7"/>
      <stop offset="100%" stop-color="#f4f1e6"/>
    </linearGradient>
    <linearGradient id="mob-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5bc58a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2f7a4d" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b9852e"/>
      <stop offset="100%" stop-color="#7a5a1e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#mob-bg)"/>

  <!-- Organic ambient aura in top-right -->
  <circle cx="700" cy="200" r="320" fill="url(#mob-green-grad)"/>
  <circle cx="650" cy="750" r="260" fill="#b9852e" fill-opacity="0.04"/>

  <!-- Subtle grid lines (scientific research feel) -->
  <line x1="100" y1="0" x2="100" y2="1000" stroke="#e8e6dd" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="700" y1="0" x2="700" y2="1000" stroke="#e8e6dd" stroke-width="1" stroke-dasharray="4 8"/>
  <line x1="0" y1="600" x2="800" y2="600" stroke="#e8e6dd" stroke-width="1" stroke-dasharray="4 8"/>

  <!-- Modern Botanical & Book Motif (Bottom Right) -->
  <g transform="translate(480, 640)">
    <!-- Open Book Stack Outline -->
    <rect x="-80" y="-20" width="260" height="180" rx="8" fill="#ffffff" stroke="#e8e6dd" stroke-width="2"/>
    <rect x="-60" y="-40" width="260" height="180" rx="8" fill="#ffffff" stroke="#1e4d33" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="-40" y="-60" width="260" height="180" rx="8" fill="#ffffff" stroke="#b9852e" stroke-width="2" stroke-opacity="0.6"/>
    
    <!-- Gold foil line details on top book -->
    <line x1="-10" y1="-30" x2="180" y2="-30" stroke="#b9852e" stroke-width="1.5"/>
    <line x1="-10" y1="-10" x2="140" y2="-10" stroke="#b9852e" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Botanical Leaf Line Art -->
    <path d="M 60,-120 C 120,-160 160,-100 140,-50 C 120,0 70,-40 60,-120 Z" fill="none" stroke="#2f7a4d" stroke-width="2.5"/>
    <path d="M 60,-120 C 100,-70 120,-30 140,-50" fill="none" stroke="#2f7a4d" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Secondary delicate leaf branch -->
    <path d="M 20,-140 Q 60,-180 100,-160" fill="none" stroke="#5bc58a" stroke-width="2"/>
    <circle cx="100" cy="-160" r="5" fill="#5bc58a"/>
    <circle cx="50" cy="-165" r="4" fill="#b9852e"/>
  </g>

  <!-- Editorial watermark / brand seal at top right -->
  <g transform="translate(680, 80)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#b9852e" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#1e4d33" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Geist', 'Segoe UI', sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#b9852e">EST. 2026</text>
  </g>
</svg>