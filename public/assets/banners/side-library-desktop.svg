<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="side2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123a24"/>
      <stop offset="100%" stop-color="#0b2416"/>
    </linearGradient>
    <radialGradient id="side2-radial" cx="90%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#5bc58a" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#2f7a4d" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#side2-bg)"/>
  <rect width="800" height="600" fill="url(#side2-radial)"/>

  <!-- Delicate gold border accent -->
  <rect x="16" y="16" width="768" height="568" rx="16" fill="none" stroke="#1e4d33" stroke-width="1.5"/>

  <!-- Scholarly Library Book Stack Illustration -->
  <g transform="translate(560, 300)">
    <!-- Geometric book array -->
    <rect x="-60" y="-80" width="130" height="170" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#b9852e" stroke-width="1.5"/>
    <rect x="-40" y="-100" width="130" height="170" rx="4" fill="#ffffff" fill-opacity="0.12" stroke="#5bc58a" stroke-width="1.5"/>
    <line x1="-30" y1="-80" x2="60" y2="-80" stroke="#b9852e" stroke-width="1.5"/>
    <line x1="-30" y1="-60" x2="40" y2="-60" stroke="#e9d8ae" stroke-width="1"/>
    
    <!-- Plant leaf emerging from book -->
    <path d="M 25,-100 Q 50,-150 90,-140 Q 60,-115 25,-100 Z" fill="#5bc58a" fill-opacity="0.4" stroke="#5bc58a" stroke-width="1.5"/>
  </g>

  <!-- Clean category badge in corner -->
  <g transform="translate(36, 48)">
    <rect width="130" height="28" rx="14" fill="#1e4d33"/>
    <text x="65" y="18" text-anchor="middle" font-family="'Geist', sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#e9d8ae">DIGITAL LIBRARY</text>
  </g>
</svg>